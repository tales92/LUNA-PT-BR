name: Build LUNA PT-BR + ZSO + OPL default ZIP

on:
  push:
    branches: [main, feature/native-chd-matrix-r2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-luna-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_IMAGE: ps2max/dev@sha256:e390699d46818e7c736f414ae5b1789d3ef7d3d914ce646a8a7bd027bd7e4521
    steps:
      - name: Check out LUNA-PT-BR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize build submodules
        shell: bash
        run: |
          set -euxo pipefail
          git submodule update --init --recursive nhddl neutrino opl

      - name: Apply native CHD reader to bundled OPL runtime
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/apply-native-chd.sh "$GITHUB_WORKSPACE/opl"

      - name: Install CHD fixture tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mame-tools genisoimage

      - name: Create and verify a supported CHD fixture
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/chd-fixture/files
          dd if=/dev/zero of=/tmp/chd-fixture/files/repeated-zero-data.bin bs=1M count=4 status=none
          printf 'LUNA native CHD test fixture\n' > /tmp/chd-fixture/files/readme.txt
          genisoimage -quiet -o /tmp/chd-fixture.iso -V LUNACHDTEST -R /tmp/chd-fixture
          chdman createdvd -i /tmp/chd-fixture.iso -o /tmp/chd-fixture.chd -c zlib -hs 262144
          chdman verify -i /tmp/chd-fixture.chd

      - name: Compile CHD reader host harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/opl/tests"
          git -C "$GITHUB_WORKSPACE/opl" show 0e3fb918a2a0690553a4a254d7f4d89924ed14af:tests/chd_reader_test.c > "$GITHUB_WORKSPACE/opl/tests/chd_reader_test.c"
          gcc -std=c99 -O2 -DCHD_HOST_TEST -I "$GITHUB_WORKSPACE/opl/modules/isofs" "$GITHUB_WORKSPACE/opl/tests/chd_reader_test.c" "$GITHUB_WORKSPACE/opl/modules/isofs/chd.c" -o /tmp/chd-reader-test
          test -x /tmp/chd-reader-test

      - name: Compare decoded CHD sectors against the source ISO
        shell: bash
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          timeout 60s /tmp/chd-reader-test /tmp/chd-fixture.chd /tmp/chd-fixture.iso

      - name: Validate and apply PT-BR, OPL-default, and ZSO customizations
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/apply-luna-pt-br-zso.py tools/apply-luna-chd.py
          python3 tools/apply-luna-pt-br-zso.py "$GITHUB_WORKSPACE/nhddl"
          python3 tools/apply-luna-chd.py "$GITHUB_WORKSPACE/nhddl" "$GITHUB_WORKSPACE/opl"

      - name: Build Neutrino runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/neutrino \
            "$BUILD_IMAGE" sh -eu -c '
              git config --global --add safe.directory /workspace/neutrino
              make clean all release
            '

      - name: Build OPL runtime modules
        shell: bash
        run: |
          set -euxo pipefail
          pwsh -NoLogo -NoProfile -File tools/build-opl-core.ps1 -Image "$BUILD_IMAGE"

      - name: Compile LUNA
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_IMAGE" sh -eu -c '
              git config --global --add safe.directory /workspace/nhddl
              if [ ! -e "$PS2SDK/ps2dev.cmake" ]; then
                ln -s ../share/ps2dev.cmake "$PS2SDK/ps2dev.cmake"
              fi
              sh /workspace/tools/bootstrap-ps2-libtiff.sh
              cmake -S /workspace/nhddl -B /workspace/nhddl/build-ci \
                -DCMAKE_BUILD_TYPE=Release \
                -DLUNA_EMULATOR_BUILD=OFF \
                -DLUNA_ENABLE_PSXCORE=OFF
              cmake --build /workspace/nhddl/build-ci --parallel 2
              test -s /workspace/nhddl/build-ci/luna.elf
            '

      - name: Build Matrix R2 LUNA forwarder
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/tools/matrix-luna-forwarder \
            "$BUILD_IMAGE" sh -eu -c '
              make all
              test -s BOOT2.ELF
            '
          mkdir -p dist/BOOT
          cp tools/matrix-luna-forwarder/BOOT2.ELF dist/BOOT/BOOT2.ELF
          file dist/BOOT/BOOT2.ELF

      - name: Package installable FMCB ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          build_id="$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          cp nhddl/build-ci/luna.elf "dist/LUNA-local-test-${build_id}.elf"
          pwsh -NoLogo -NoProfile -File tools/package-fmcb.ps1 -LocalTest "$build_id"
          ls -lh dist/*.zip dist/SHA256SUMS.txt

      - name: Upload ZIP artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LUNA-PT-BR-ZSO-CHD-MATRIX-R2-FMCB-${{ github.sha }}
          path: |
            dist/LUNA-local-test-*-FMCB-mc0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LUNA PT-BR + ZSO + native CHD + OPL default + Matrix R2 boot"
            echo
            echo "- Source revision: \`$GITHUB_SHA\`"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Build: passed"
              echo "- ZIP artifact: [download from this workflow run](${{ steps.upload.outputs.artifact-url }})"
            else
              echo "- Build: failed; inspect the preceding step logs."
            fi
            echo "- App customizations: PT-BR default, OPL as the fresh-install game core, ZSO discovery/launch support, CHD v5 DVD/zlib reader, and Matrix R2 forwarder."
            echo "- CHD scope: 2048-byte DVD sectors, zlib codec, raw hunks and self-hunk aliases only; physical PS2 compatibility remains unverified."
          } >> "$GITHUB_STEP_SUMMARY"
